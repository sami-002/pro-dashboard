      const profilePanel = document.getElementById("profilePanel");
      const actionMessage = document.getElementById("actionMessage");
    openSidebar.addEventListener("click" , function(){
      sidebar.classList.add("is-open");
      overlay.classList.add("is-open");
    })
    closeSidebar.addEventListener("click" , function(){
      sidebar.classList.remove("is-open");
      overlay.classList.remove("is-open");
    });
    overlay.addEventListener("click" , function(){
      sidebar.classList.remove("is-open")
      overlay.classList.remove("is-open")
    });
     notificationButton.addEventListener("click" , function(){
      notificationPanel.classList.toggle("show");
      profilePanel.classList.remove("show");
     });
     profileButton.addEventListener("click", function(){
       profilePanel.classList.toggle("show");
       notificationButton.classList.remove("show");
     });
     document.addEventListener("click", function(event){
      if(
        !event.target.closest("#notificationButton") && 
        !event.target.closest("#notificationPanel") &&
        !event.target.closest("#profileButton") &&
        !event.target.closest("#profilePanel")
        ){
        notificationPanel.classList.remove("show");
        profilePanel.classList.remove("show");
      }

     });
     document.addEventListener("keydown", function(event){
      if(event.key === "Escape"){
        sidebar.classList.remove("is-open");
        overlay.classList.remove("is-open");
        notificationPanel.classList.remove("show");
        profilePanel.classList.remove("remove");
      }
     });

    const quizPages = {
      "JavaScript Fundamentals": "quizmaster.html",
      "HTML & CSS": "htmlcss.html",
      "Bootstrap 5": "bootsrap.html",
      "General Knowledge": "generalknowledge.html"
    };
    document.querySelectorAll(".start-button[data-quiz]").forEach(function (button) {
      button.addEventListener("click", function () {
        const quizPage = quizPages[button.dataset.quiz];
        if (quizPage) window.location.href = quizPage;
      });
    });
    // SEARCH QUIZZES
    const searchInput = document.getElementById("quizSearch");
    const cards = document.querySelectorAll("#quizGrid article");
    const noSearchResult = document.getElementById("noSearchResult");
    searchInput.addEventListener("input" , function(){
    const searchText = searchInput.value.toLowerCase();
    let found = false;
    for (let i = 0; i < cards.length; i++){

    
    const cardText = cards[i].getAttribute("data-search");
    if(cardText.includes(searchText)){
      
      cards[i].classList.remove("hidden");
     found = true;
    }else{
      cards[i].classList.add("hidden")
    };
    if(found){
      noSearchResult.classList.add("hidden")
    }else{
      noSearchResult.classList.remove("hidden")
    }
    }
   });

    });


  </script>
